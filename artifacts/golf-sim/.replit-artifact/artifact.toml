kind = "web"
previewPath = "/"
title = "Golf SIM"
description = "The existing Golf SIM website for golf simulator customers and staff, preserving public booking, staff administration, and Google Calendar synchronization."
version = "1.0.0"
id = "artifacts/golf-sim"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19351

[services.development]
run = "pnpm --filter @workspace/golf-sim run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/golf-sim", "run", "build" ]
serve = "static"
publicDir = "artifacts/golf-sim/dist/public"

[[services.production.rewrites]]
from = "/about"
to = "/about/index.html"

[[services.production.rewrites]]
from = "/rates"
to = "/rates/index.html"

[[services.production.rewrites]]
from = "/gallery"
to = "/gallery/index.html"

[[services.production.rewrites]]
from = "/contact"
to = "/contact/index.html"

[[services.production.rewrites]]
from = "/booking"
to = "/booking/index.html"

[[services.production.rewrites]]
from = "/login"
to = "/login/index.html"

[[services.production.rewrites]]
from = "/admin"
to = "/admin/index.html"

[[services.production.rewrites]]
from = "/politique-de-confidentialite"
to = "/politique-de-confidentialite/index.html"

[[services.production.rewrites]]
from = "/politique-de-cookies"
to = "/politique-de-cookies/index.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19351"
BASE_PATH = "/"
