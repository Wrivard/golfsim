    background: "#F7F3E8"
    foreground: "#1B1A18"
    accent: "#2B5734"
    surface: "#FFFFFF"
    muted: "#70695C"
  fonts:
    display: Oswald
    body: DM Sans
background:
  kind: solid
  color:
    kind: token
    token: background
assets:
