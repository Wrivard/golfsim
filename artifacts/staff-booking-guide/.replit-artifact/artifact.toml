kind = "slides"
previewPath = "/staff-guide/"
title = "Guide de réservation — Personnel"
description = "Guide imprimable en français pour le personnel de Golf SIM Sorel-Tracy : réservations côté client puis côté administration, avec captures réelles, repères numérotés et instructions pas à pas."
version = "1.0.0"
id = "artifacts/staff-booking-guide"
router = "path"

[[services]]
name = "web"
paths = [ "/staff-guide/" ]
localPort = 23177

[services.development]
run = "pnpm --filter @workspace/staff-booking-guide run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/staff-booking-guide", "run", "build" ]
serve = "static"
publicDir = "artifacts/staff-booking-guide/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23177"
BASE_PATH = "/staff-guide/"
